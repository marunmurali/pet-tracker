# Always-on deployment. Reuses the dev container image (same deps on amd64 and arm64 / Raspberry Pi 5).
#   docker compose up -d --build
#   docker compose logs -f
services:
  pet-tracker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: pet-tracker:latest
    container_name: pet-tracker
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"  # so files in data/ stay owned by you, not root
    working_dir: /app
    command: ["python", "-m", "app.main"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./app:/app/app:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "${DASHBOARD_PORT:-8000}:${DASHBOARD_PORT:-8000}"
    stop_grace_period: 30s  # lets in-progress clips finish encoding
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${DASHBOARD_PORT:-8000}/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
